name: ci

# Gates defined in docs/engineering-standards.md §7. Steps 6-7 (corpus coverage
# and generation benchmark) are added at stage S2; they are not applicable yet.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install (frozen lock)
        run: uv sync --frozen --all-groups

      - name: Lint (core, agent, app, guardrail tests)
        run: >
          uvx ruff check src/pocker_agent/core src/pocker_agent/agent src/pocker_agent/app.py
          scripts/e2e_smoke.py scripts/benchmark_generation.py scripts/doctor.py scripts/run_web.py
          tests/test_core_interpreter.py tests/test_capability.py tests/test_session_api.py
          tests/test_architecture_invariants.py tests/test_oracle_fixtures.py
          tests/test_ir_and_war.py tests/test_agent_loop.py tests/test_s2_axes.py
          tests/test_s3_axes.py tests/test_s4_axes.py tests/test_s5_axes.py
          tests/test_s6_axes.py tests/test_s7_axes.py tests/test_s8_macros.py
          tests/test_generation_benchmark.py tests/test_web_diagnostics.py
          tests/test_plan_identity.py tests/test_card_identity.py tests/test_g2_m1.py
          tests/test_g2_m2.py tests/test_g2_m3.py tests/test_g2_m3_verify.py
          tests/test_g2_m3_contract.py tests/test_g2_m3_terminal.py
          tests/test_g2_m3_scenario_c.py tests/test_g2_m3_action_sequence.py
          tests/test_g2_m3_guard_top.py tests/test_g2_m3_skip.py
          tests/test_g2_m3_draw_pass.py tests/test_g2_m3_scenario_b.py
          tests/test_g2_m3_review_fixes.py
          tests/test_m4_design_store.py tests/test_m4_design_api.py
          tests/test_m4_design_service.py tests/test_m4_design_rules.py
          tests/test_m4_design_compile.py tests/test_m4_design_verify.py
          tests/test_m4_design_finalize.py

      - name: Architecture invariants (blocking)
        run: uv run --frozen pytest tests/test_architecture_invariants.py -q

      - name: Test suite
        run: uv run --frozen pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
